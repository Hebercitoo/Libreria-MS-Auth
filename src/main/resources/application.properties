# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=auth-service
server.port=${auth.server.port:8084}
# Gateway: las rutas se reenvian tal cual (/auth/**), sin reescritura.
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico); se puede apagar en local sin servidor
eureka.client.enabled=${auth.eureka.enabled:true}
eureka.client.service-url.defaultZone=${eureka.default-zone:http://localhost:8761/eureka/}

# JSON: no serializar nulos (ej: Envelope.single sin pagination)
spring.jackson.default-property-inclusion=non_null

# Swagger / OpenAPI (habilitado por defecto; override via auth.api-docs.enabled)
springdoc.api-docs.enabled=${auth.api-docs.enabled:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos compartida
# prepareThreshold=0: el pooler de Supabase (pgbouncer en modo transaccion)
# no soporta prepared statements; se configura aca y es sobreescrible
# desde private.properties (db.prepareThreshold).
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase: el esquema (user_account, role, user_wishlist) ya existe en la
# base compartida y lo administra el common.
# Este servicio no crea tablas ni migra nada.
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
auth.log.path=logs
auth.log.file=auth-service.log
auth.log.level.com.bigobooks=INFO
auth.log.level.repositories=DEBUG
auth.log.level.sql=DEBUG

# Seguridad (login/register). El secreto JWT y la vigencia se pueden sobreescribir
# desde private.properties (jwt.secret / jwt.expiration-minutes). El secreto debe
# coincidir con el de los demas servicios para que el token sea interoperable.
security.auth.default-role=${auth.default-role:READER}
jwt.secret=${jwt.secret:cambia-este-secreto-de-desarrollo-de-al-menos-32-chars}
jwt.expiration-minutes=${jwt.expiration-minutes:120}
