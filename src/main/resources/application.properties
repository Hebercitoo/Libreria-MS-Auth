# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=auth-service
server.port=8084
# Gateway: las rutas se reenvian tal cual (/auth/**), sin reescritura.
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico); se puede apagar en local sin servidor
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JSON: no serializar nulos (ej: Envelope.single sin pagination)
spring.jackson.default-property-inclusion=non_null

# Swagger 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos compartida
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Este servicio no crea migraciones
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
auth.log.path=logs
auth.log.file=auth-service.log
auth.log.level.com.bigobooks=INFO
auth.log.level.repositories=DEBUG
auth.log.level.sql=DEBUG

# Seguridad (login/register). El secreto JWT  se pueden sobreescribir
# desde private.properties (como jwt.expiration-minutes). El secreto debe
# coincidir con el de los demas servicios para que el token sea interoperable.
security.auth.default-role=CLIENT
security.roles.user-roles-manage=ADMIN
jwt.secret=${jwt.secret}
jwt.expiration-minutes=120
