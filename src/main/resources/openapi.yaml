# cSpell:disable
openapi: 3.0.3
info:
  title: BigoBooks Auth API
  description: >-
    Microservicio de autenticacion de BigoBooks. Expone el registro y el login
    de usuarios y emite el token JWT (HS256) compartido entre servicios. Los
    schemas de request/response viven en el common (Entrega 1) salvo
    AuthResponse, que se genera en este servicio. Las respuestas usan el
    envoltorio estandar Envelope {data, pagination} y los errores el ErrorDto.
  version: 1.0.0
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Registra un usuario nuevo con rol de lector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Autentica un usuario y devuelve el token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login correcto; el token tambien se envia en la cookie 'token'
          headers:
            Set-Cookie:
              description: Cookie con el token JWT (token=...)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: Peticion invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Conflict:
      description: Operacion no permitida en el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Unauthorized:
      description: Credenciales invalidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    InternalServerError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
  schemas:
    # Los siguientes schemas se documentan aca pero NO se generan
    # (modelsToGenerate): sus clases viven en el JAR del common.
    Envelope:
      type: object
      description: Envoltorio estandar de respuesta (data = DTO del recurso; pagination solo en listados)
      properties:
        data:
          type: object
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ErrorDto:
      type: object
      properties:
        message:
          type: string
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    RegisterDto:
      type: object
      properties:
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        city:
          type: string
        warehouseId:
          type: integer
          format: int64
      required:
        - name
        - lastName
        - email
        - password
        - city
    UserAccountDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        city:
          type: string
        warehouseId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        roleId:
          type: integer
          format: int64
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Vigencia del token en segundos
        user:
          $ref: '#/components/schemas/UserAccountDto'
