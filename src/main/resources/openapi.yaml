# cSpell:disable
openapi: 3.0.3
info:
  title: BigoBooks Auth API
  description: >-
    Microservicio de autenticacion de BigoBooks. Expone el registro, login y
    asignacion administrativa de roles; emite el token JWT (HS512) compartido entre servicios. Los
    schemas de request/response viven en el common. Las respuestas usan el
    envoltorio estandar Envelope {data, pagination} y los errores el ErrorDto.
  version: 1.0.0
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Registra un usuario nuevo con rol CLIENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Autentica un usuario y devuelve el token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login correcto; el token tambien se envia en la cookie 'token'
          headers:
            Set-Cookie:
              description: Cookie con el token JWT (token=...)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/users/{userId}/roles:
    put:
      tags: [auth]
      operationId: assignUserRoles
      summary: Reemplaza los roles de un usuario (solo ADMIN)
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/UserRolesRequestDto'
      responses:
        '200':
          description: Roles actualizados
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Se requiere el rol ADMIN
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/ErrorDto'
        '404':
          description: No existe el usuario o alguno de los roles
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/ErrorDto'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Peticion invalida
      content:
        application/json:
          schema:
            $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/ErrorDto'
    Conflict:
      description: Operacion no permitida en el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/ErrorDto'
    Unauthorized:
      description: Credenciales invalidas
      content:
        application/json:
          schema:
            $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/ErrorDto'
    InternalServerError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '../../../../../common/src/main/resources/openapi.yaml#/components/schemas/ErrorDto'
