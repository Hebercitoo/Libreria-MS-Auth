# cSpell:disable
# Propiedades de test: sombrean a src/main/resources/application.properties.

# Imports
spring.config.import=optional:classpath:config/private.properties,optional:classpath:config/private.properties.example

# Configuraciones de la aplicacion
spring.application.name=auth-service
server.port=${auth.server.port:8084}

# Swagger / OpenAPI
springdoc.api-docs.enabled=false

# Eureka apagado en tests
eureka.client.enabled=false

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase deshabilitado (no hay migraciones propias)
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
auth.log.path=logs
auth.log.file=auth-service.log
auth.log.level.com.bigobooks=INFO
auth.log.level.repositories=DEBUG
auth.log.level.sql=DEBUG

# Seguridad (login/register)
security.auth.default-role=${auth.default-role:READER}
jwt.secret=${jwt.secret:cambia-este-secreto-de-desarrollo-de-al-menos-32-chars}
jwt.expiration-minutes=${jwt.expiration-minutes:120}
